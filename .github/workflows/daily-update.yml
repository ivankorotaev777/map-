name: Daily map update

on:
  schedule:
    # 01:00 UTC = 06:00 Tashkent (quietest hour for new listings)
        - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape joymee commercial rentals
        run: python scripts/scrape.py

      - name: Classify listings
        run: python scripts/classify.py

      - name: Fetch Uzum zones + delivery points
        run: python scripts/fetch_uzum.py

      - name: Fetch Uzum per-hex population (cached)
        run: python scripts/fetch_uzum_population.py

      # Overpass is a shared free service; the script keeps the previous file if it is
      # unreachable, so a bad Overpass day cannot break the daily map.
      - name: Fetch OSM points of attraction (markets / supermarkets / banks)
        run: python scripts/fetch_poi.py

      - name: Build map
        run: python scripts/build_map.py

      - name: Copy output to index.html
        run: cp /tmp/joymee_uzum_map.html index.html

      - name: Commit and push if changed
        run: |
          # The population cache must be committed too — it is what stops tomorrow's run
          # from making ~6k API calls all over again.
          # The shortlist files belong here as well: build_map.py rewrites them on every run,
          # and leaving them out froze the downloadable Excel on the day it was last committed
          # by hand while the map kept refreshing — the two then disagreed on which hex is #4.
          # The .csv is the change signal (plain text, no timestamps); the .xlsx rides along,
          # since openpyxl stamps it with the build time and would otherwise differ every day.
          if git diff --quiet index.html data/uzum_population.json data/poi_region.geojson \
                              data/pvz_shortlist.csv; then
            echo "✅ Map is unchanged today, nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html data/uzum_population.json data/poi_region.geojson \
                    data/pvz_shortlist.csv data/pvz_shortlist.xlsx
            git commit -m "🤖 Auto-update map: $(date -u +%Y-%m-%d)"
            git push
            echo "✅ Pushed updated map"
          fi

      - name: Send Telegram digest
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/notify.py
